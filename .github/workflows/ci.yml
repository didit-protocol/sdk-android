name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-build:
    name: Consumer app builds against the published Maven repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Builds two minimal consumer apps that resolve the published artifacts
      # from the repository/ directory of THIS commit (not the network copy),
      # compile against the SDK entry point, and package debug APKs:
      #   app-bundle - ONLY me.didit:didit-sdk (+ the opt-in -play artifact),
      #     so a bundle POM that drops a transitive module edge fails here
      #     instead of being masked by explicit standalone dependencies;
      #   app-split - the five standalone artifacts without the bundle, so
      #     each must resolve and compile on its own.
      # Tripwire for broken or missing AARs, bad POM metadata, and
      # unresolvable transitive dependencies - the failure class that
      # otherwise only surfaces in integrators' builds after a release.
      - name: Build consumer apps
        run: gradle -p ci/consumer :app-bundle:assembleDebug :app-split:assembleDebug --no-daemon
