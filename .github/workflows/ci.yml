name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-build:
    name: Consumer app builds against the published Maven repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Builds a minimal consumer app that resolves every published artifact
      # from the repository/ directory of THIS commit (not the network copy),
      # compiles against the SDK entry point, and packages a debug APK. This
      # is the tripwire for broken or missing AARs, bad POM metadata, and
      # unresolvable transitive dependencies - the failure class that
      # otherwise only surfaces in integrators' builds after a release.
      - name: Build consumer app
        run: gradle -p ci/consumer :app:assembleDebug --no-daemon
